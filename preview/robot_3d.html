<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网球捡球机器人 · 一体箱 + 左右轴滚轮</title>
<style>
  :root{--bg:#0e1218;--panel:#161c26;--ink:#e8eef4;--muted:#8b9aab;--accent:#e85d04;--line:#273040;--ok:#3dd68c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:318px 1fr;overflow:hidden}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 14px;overflow-y:auto}
  h1{font-size:15px;font-weight:600;margin-bottom:4px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .path{background:#10161e;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;line-height:1.75}
  .path b{color:var(--accent)}.path .ok{color:var(--ok)}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .stat div{background:#10161e;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font-size:17px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--muted)}
  .gt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
  .pb{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;margin-bottom:3px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font-size:12.5px;cursor:pointer;text-align:left}
  .pb:hover{background:#1c2532}.pb.on{background:#1c2532;border-color:var(--accent)}
  .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .dm{font-size:10.5px;color:var(--muted);margin-left:auto}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .act{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:#10161e;color:var(--ink);font-size:12px;cursor:pointer}
  .act:hover{border-color:var(--accent);color:var(--accent)}.act.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{position:relative;min-width:0}
  #w{width:100%;height:100%}
  canvas{display:block;width:100%!important;height:100%!important}
  .hud{position:absolute;left:14px;bottom:14px;font-size:11.5px;color:var(--muted);background:rgba(14,18,24,.72);padding:7px 11px;border-radius:7px;pointer-events:none}
  .bd{position:absolute;right:14px;top:14px;font-size:11px;color:var(--muted);background:rgba(14,18,24,.72);padding:5px 9px;border-radius:6px}
  @media(max-width:720px){body{grid-template-columns:1fr;grid-template-rows:1fr 210px}aside{order:2;border-right:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>网球捡球机器人</h1>
  <p class="sub">一体箱 + 前部左右轴滚轮<br/>滚轮和储球在同一箱体，无隔墙</p>
  <div class="path">
    <b>滚轮怎么收球</b><br/>
    <span class="ok">①</span> 车前进，球进前贴地口<br/>
    <span class="ok">②</span> <b>左右轴</b>滚轮把球向上向后带<br/>
    <span class="ok">③</span> 后上导流板把球送进内腔<br/>
    <span class="ok">④</span> 内腔堆积（开口朝上）<br/>
    <span class="ok">⑤</span> 后翻门卸球
  </div>
  <div class="stat">
    <div><b>Ø13</b><span>滚轮直径 cm</span></div>
    <div><b>左右轴</b><span>滚轮方向</span></div>
    <div><b>一体箱</b><span>无隔墙挡球</span></div>
    <div><b>~100</b><span>实用容量</span></div>
  </div>
  <div class="gt">车体</div><div id="g-structure"></div>
  <div class="gt">收集链路</div><div id="g-actuation"></div>
  <div class="gt">感知定位</div><div id="g-sensing"></div>
  <div class="gt">行走 / 动力</div><div id="g-power"></div>
  <div class="acts">
    <button class="act" id="b-path">显示球路径</button>
    <button class="act" id="b-ex">分解视图</button>
    <button class="act" id="b-wi">线框</button>
    <button class="act on" id="b-gr">地面</button>
    <button class="act" id="b-ca">整机视角</button>
  </div>
</aside>
<main>
  <div id="w"></div>
  <div class="hud">拖拽旋转 · 点零件聚焦 · 滚轮轴线为左右向</div>
  <div class="bd">一体箱 · 左右轴滚轮</div>
</main>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const wrap=document.getElementById('w');
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(wrap.clientWidth,wrap.clientHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;
wrap.appendChild(R.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0e1218);
scene.fog=new THREE.Fog(0x0e1218,4,14);

const cam=new THREE.PerspectiveCamera(38,wrap.clientWidth/wrap.clientHeight,.01,60);
const defPos=new THREE.Vector3(1.7,1.2,1.05);
cam.position.copy(defPos);
const ctrl=new OrbitControls(cam,R.domElement);
ctrl.enableDamping=true;ctrl.target.set(0,.20,0);
ctrl.maxPolarAngle=Math.PI*.48;ctrl.minDistance=.45;ctrl.maxDistance=5;

scene.add(new THREE.AmbientLight(0xa8b8c8,.42));
const key=new THREE.DirectionalLight(0xffffff,1.75);
key.position.set(2.6,3.6,1.7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
const sc=key.shadow.camera;sc.left=-1.6;sc.right=1.6;sc.top=1.6;sc.bottom=-1.6;
scene.add(key);
const fill=new THREE.DirectionalLight(0x88aacc,.4);fill.position.set(-2.2,1.5,-1.2);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffaa66,.3);rim.position.set(0,.6,-2.4);scene.add(rim);

const grid=new THREE.GridHelper(8,32,0x273040,0x161c26);scene.add(grid);
const ground=new THREE.Mesh(new THREE.CircleGeometry(2.5,64),new THREE.MeshStandardMaterial({color:0x152232,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const lineM=new THREE.MeshStandardMaterial({color:0xcfd6de,roughness:.55});
function line(w,d,x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.004,d),lineM);m.position.set(x,.002,z);scene.add(m)}
line(2.6,.05,0,1.0);line(.05,2.6,1.0,0);

const M={
  shell:new THREE.MeshStandardMaterial({color:0xd0d2d6,metalness:.08,roughness:.40}),
  dark:new THREE.MeshStandardMaterial({color:0x1a1c20,metalness:.2,roughness:.45}),
  roll:new THREE.MeshStandardMaterial({color:0x2a2a2e,metalness:.1,roughness:.78}),
  fin:new THREE.MeshStandardMaterial({color:0xf07818,metalness:.05,roughness:.55}),
  rubber:new THREE.MeshStandardMaterial({color:0x0a0a0a,metalness:0,roughness:.92}),
  metal:new THREE.MeshStandardMaterial({color:0x8a9098,metalness:.88,roughness:.28}),
  hole:new THREE.MeshStandardMaterial({color:0x08080a,metalness:0,roughness:.88}),
  mesh:new THREE.MeshStandardMaterial({color:0x8c9094,metalness:.65,roughness:.35}),
  def:new THREE.MeshStandardMaterial({color:0x666a70,metalness:.4,roughness:.40}),
  ball:new THREE.MeshStandardMaterial({color:0xb8d84a,metalness:0,roughness:.62}),
  white:new THREE.MeshStandardMaterial({color:0xe6e6e6,metalness:0,roughness:.4}),
  glass:new THREE.MeshStandardMaterial({color:0x0c2840,metalness:.4,roughness:.08}),
  led:new THREE.MeshStandardMaterial({color:0x22d866,emissive:0x11aa44,emissiveIntensity:.75,roughness:.25}),
  frame:new THREE.MeshStandardMaterial({color:0x2a2e34,metalness:.4,roughness:.42}),
  path:new THREE.MeshStandardMaterial({color:0x3dd68c,emissive:0x11aa55,emissiveIntensity:.6,transparent:true,opacity:.9}),
};

// 坐标系：X前 / Y上 / Z左右
// 与 Blender 同源尺寸
const D={
  bodyX0:-.30, bodyL:.56, bodyW:.46, bodyH:.38, bodyZ:.08, bodyTop:.46, bodyCx:.02,
  mouthW:.38, mouthH:.10, mouthZ:.045,
  rollD:.13, rollL:.34, rollX:.18, rollZ:.06, finN:8, finH:.016, defAng:35*Math.PI/180,
  doorH:.28,
  wr:.075, ww:.05, wy:.205, wxRear:-.16, wxFront:.16, cr:.04,
  mx:.22, mh:.10, mz:.46,
};

const robot=new THREE.Group();scene.add(robot);
const parts={},meta=[],G={
  structure:document.getElementById('g-structure'),
  actuation:document.getElementById('g-actuation'),
  sensing:document.getElementById('g-sensing'),
  power:document.getElementById('g-power'),
};
function box(w,h,d,mat,x,y,z,rx,ry,rz){
  // w沿X, h沿Y, d沿Z
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x||0,y||0,z||0);m.rotation.set(rx||0,ry||0,rz||0);
  m.castShadow=m.receiveShadow=true;return m;
}
function cyl(r,h,mat,x,y,z,rx,ry,rz,seg){
  // 圆柱默认轴=Y。要轴沿Z（左右）：rx=Math.PI/2
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||48),mat);
  m.position.set(x||0,y||0,z||0);m.rotation.set(rx||0,ry||0,rz||0);
  m.castShadow=m.receiveShadow=true;return m;
}
function ball(r,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,22,12),mat);
  m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;
}
function reg(key,g,o){parts[key]=g;g.userData.key=key;g.userData.base=g.position.clone();robot.add(g);meta.push({key:key,name:o.name,color:o.color,dims:o.dims,group:o.group,desc:o.desc})}

// ── 一体箱壳（顶敞开，前下开口）──
{
  const g=new THREE.Group();
  const t=.014, bz=D.bodyZ+D.bodyH/2;
  g.add(box(D.bodyL,t,D.bodyW,M.shell,D.bodyCx,D.bodyZ+t/2,0));
  g.add(box(t,D.bodyH,D.bodyW,M.shell,D.bodyX0+t/2,bz,0));
  for(const z of [D.bodyW/2-t/2,-(D.bodyW/2-t/2)]){
    g.add(box(D.bodyL,D.bodyH,t,M.shell,D.bodyCx,bz,z));
    g.add(box(D.bodyL*.50,.012,.018,M.frame,D.bodyCx-.02,bz+.06,z*1.02));
    g.add(box(D.bodyL*.46,D.bodyH*.42,.006,M.mesh,D.bodyCx-.02,bz+.01,z*1.02));
  }
  // 前壁上半
  const upH=D.bodyH-D.mouthH-.02;
  g.add(box(t,upH,D.bodyW,M.shell,D.bodyX0+D.bodyL-t/2, D.mouthZ+D.mouthH/2+upH/2+.01,0));
  // 前壁口两侧
  const sideW=(D.bodyW-D.mouthW)/2;
  for(const z of [D.mouthW/2+sideW/2, -(D.mouthW/2+sideW/2)]){
    g.add(box(t,D.mouthH+.02,sideW,M.shell,D.bodyX0+D.bodyL-t/2,D.mouthZ+.005,z));
  }
  // 口内衬 + 前唇
  g.add(box(.06,D.mouthH-.008,D.mouthW-.012,M.hole,D.bodyX0+D.bodyL-.035,D.mouthZ,0));
  g.add(box(.028,.026,D.mouthW+.01,M.rubber,D.bodyX0+D.bodyL+.006,.020,0));
  // 顶沿
  g.add(box(D.bodyL-.01,.016,.02,M.frame,D.bodyCx,D.bodyTop-.005,D.bodyW/2-.01));
  g.add(box(D.bodyL-.01,.016,.02,M.frame,D.bodyCx,D.bodyTop-.005,-(D.bodyW/2-.01)));
  g.add(box(.02,.016,D.bodyW-.02,M.frame,D.bodyX0+D.bodyL-.01,D.bodyTop-.005,0));
  g.add(box(.02,.016,D.bodyW-.02,M.frame,D.bodyX0+.01,D.bodyTop-.005,0));
  // 后翻门
  g.add(box(t,D.doorH,D.bodyW-.02,M.shell,D.bodyX0+t/2,D.bodyZ+D.doorH/2,0));
  g.add(cyl(.012,D.bodyW-.05,M.metal,D.bodyX0+t/2,D.bodyZ+D.doorH,0,Math.PI/2,0,0));
  g.add(box(.025,.02,.07,M.rubber,D.bodyX0-.015,D.bodyZ+.06,0));
  g.add(cyl(.022,.045,M.metal,D.bodyX0-.02,D.bodyZ+D.doorH-.02,D.bodyW/2-.035,0,0,0));
  // 防撞 / 灯
  for(const z of [D.bodyW/2+.008,-(D.bodyW/2+.008)])
    g.add(box(D.bodyL*.7,.032,.022,M.rubber,D.bodyCx-.02,D.bodyZ+.03,z));
  g.add(box(.022,.035,D.bodyW+.006,M.rubber,D.bodyX0-.004,D.bodyZ+.035,0));
  g.add(box(.07,.01,.022,M.led,D.bodyX0+D.bodyL-.02,D.bodyZ+D.bodyH-.02,0));
  reg('body',g,{name:'一体箱壳',color:'#d0d2d6',dims:'56×46×38 · 顶敞开',group:'structure',
    desc:'前后左右+底一体，顶敞开。滚轮和储球在同一内腔，无隔墙。'});
}

// ── ★ 滚轮 —— 轴线沿 Z（左右向）──
// Three.js 圆柱默认轴 Y；rx=π/2 后轴指向 Z
{
  const g=new THREE.Group();
  g.add(cyl(D.rollD/2,D.rollL,M.roll,D.rollX,D.rollZ,0, Math.PI/2,0,0, 64));
  g.add(cyl(.016,D.rollL+.05,M.metal,D.rollX,D.rollZ,0, Math.PI/2,0,0));
  for(let i=0;i<D.finN;i++){
    const ang=i*(2*Math.PI/D.finN);
    const fx=D.rollX+(D.rollD/2+D.finH/2)*Math.cos(ang);
    const fy=D.rollZ+(D.rollD/2+D.finH/2)*Math.sin(ang);
    // 薄片：宽沿X(0.010), 高沿Z(rollL), 厚沿径向 —— 绕Y转 -ang 对齐径向
    g.add(box(.010,D.finH,D.rollL-.04,M.fin, fx,fy,0, 0,-ang,0));
  }
  for(const z of [D.rollL/2+.008,-(D.rollL/2+.008)])
    g.add(cyl(D.rollD/2+.003,.018,M.fin,D.rollX,D.rollZ,z, Math.PI/2,0,0, 48));
  g.add(cyl(.026,.05,M.metal,D.rollX,D.rollZ,D.rollL/2+.05, Math.PI/2,0,0));
  // 导流板
  g.add(box(.16,.012,D.rollL-.02,M.def, D.rollX-D.rollD/2-.05, D.rollZ+.10,0, 0,D.defAng,0));
  for(const z of [D.rollL/2+.004,-(D.rollL/2+.004)])
    g.add(box(.16,.05,.010,M.frame, D.rollX-D.rollD/2-.05, D.rollZ+.12,z, 0,D.defAng,0));
  reg('roller',g,{name:'前部左右轴滚轮',color:'#f07818',dims:'Ø13×34 · 轴沿左右',group:'actuation',
    desc:'轴线左右向(Z)。车前进把球顶到轮上，轮转把球从下前方向上向后带，经导流板进内腔。'});
}

// ── 内腔球 ──
{
  const g=new THREE.Group();
  const br=.0335;
  for(let ix=0;ix<4;ix++)for(let iz=0;iz<4;iz++)
    g.add(ball(br,M.ball, D.bodyX0+.10+ix*.08, D.bodyZ+.04, -.12+iz*.08));
  for(let ix=0;ix<3;ix++)for(let iz=0;iz<3;iz++)
    g.add(ball(br,M.ball, D.bodyX0+.14+ix*.08, D.bodyZ+.12, -.08+iz*.08));
  for(let ix=0;ix<3;ix++)
    g.add(ball(br,M.ball, D.bodyX0+.18+ix*.09, D.bodyZ+.20, 0));
  g.add(ball(br,M.ball, D.rollX+.01, D.rollZ+D.rollD/2+br-.012, .05));
  g.add(ball(br,M.ball, .50, br, .16));
  g.add(ball(br,M.ball, .56, br, -.14));
  g.add(ball(br,M.ball, -.48, br, .20));
  reg('balls',g,{name:'内腔球',color:'#b8d84a',dims:'示意堆积',group:'actuation',
    desc:'滚轮后方+上方，同一箱体内堆积，开口朝上可见。'});
}

// ── 轮 ──
for(const [k,wx,side,lab] of [
  ['wheel_rl',D.wxRear,1,'左后驱动轮'],['wheel_rr',D.wxRear,-1,'右后驱动轮']
]){
  const g=new THREE.Group();
  g.add(cyl(D.wr,D.ww,M.rubber, wx,D.wr,side*D.wy, Math.PI/2,0,0, 48));
  g.add(cyl(D.wr*.38,D.ww+.005,M.metal, wx,D.wr,side*D.wy, Math.PI/2,0,0));
  reg(k,g,{name:lab,color:'#0a0a0a',dims:'Ø15',group:'power',desc:'后轮差速驱动。'});
}
{
  const g=new THREE.Group();
  for(const side of [1,-1]){
    g.add(cyl(D.cr,.026,M.rubber, D.wxFront,D.cr,side*D.wy, Math.PI/2,0,0));
    g.add(box(.04,.032,.028,M.metal, D.wxFront,D.cr+.016,side*D.wy));
  }
  reg('caster',g,{name:'前万向轮×2',color:'#0a0a0a',dims:'Ø8',group:'power',desc:'藏在箱下。'});
}

// ── 摄像头 ──
{
  const g=new THREE.Group();
  g.add(box(.028,D.mh,.028,M.frame, D.mx, D.mz+D.mh/2, 0));
  g.add(box(.048,.038,.048,M.dark, D.mx+.01, D.mz+D.mh+.016, 0));
  g.add(box(.028,.01,.055,M.frame, D.mx+.032, D.mz+D.mh+.034, 0));
  g.add(cyl(.013,.015,M.glass, D.mx+.030, D.mz+D.mh+.016, 0, 0,0,Math.PI/2));
  for(const z of [.026,-.026])
    g.add(cyl(.008,.011,M.metal, D.mx+.01, D.mz+D.mh+.016, z, 0,0,Math.PI/2));
  reg('camera',g,{name:'摄像头桅杆',color:'#0c2840',dims:'箱前上方',group:'sensing',desc:'不挡滚轮。'});
}
{
  const g=new THREE.Group();
  g.add(box(.035,.022,.035,M.frame, D.bodyX0+.03, D.bodyTop+.012, 0));
  g.add(cyl(.007,.09,M.metal, D.bodyX0+.03, D.bodyTop+.06, 0));
  g.add(box(.009,.065,.065,M.white, D.bodyX0+.03, D.bodyTop+.012+0.108, 0));
  g.add(box(.005,.038,.038,M.dark, D.bodyX0+.036, D.bodyTop+.012+0.108, 0));
  reg('tag',g,{name:'AprilTag 座',color:'#e6e6e6',dims:'6.5×6.5',group:'sensing',desc:'回起点。'});
}
{
  const g=new THREE.Group();
  g.add(box(.16,.05,.12,M.frame, 0, D.bodyZ+.03, -(D.bodyW/2+.028)));
  g.add(box(.035,.018,.025,M.fin, .08, D.bodyZ+.03, -(D.bodyW/2+.05)));
  reg('battery',g,{name:'电池包',color:'#2a2e34',dims:'3S 8000mAh',group:'power',desc:'侧抽。'});
}

// ── 球路径 ──
const pathGroup=new THREE.Group();pathGroup.visible=false;scene.add(pathGroup);
{
  pathGroup.add(box(.08,.02,D.mouthW,M.path, D.bodyX0+D.bodyL+.07, .028, 0));
  // 沿滚轮上翻（XZ 截面上的圆弧，Y 为高度）
  const pts=[];
  for(let i=0;i<=16;i++){
    const t=i/16;
    const ang=Math.PI + t*Math.PI;
    pts.push(new THREE.Vector3(
      D.rollX + (D.rollD/2+0.05)*Math.cos(ang),
      D.rollZ + (D.rollD/2+0.05)*Math.sin(ang),
      0));
  }
  pts.push(new THREE.Vector3(D.bodyX0+0.20, D.bodyZ+.18, 0));
  pts.push(new THREE.Vector3(D.bodyX0+0.12, D.bodyZ+.14, 0));
  const curve=new THREE.CatmullRomCurve3(pts);
  pathGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve,28,.012,8,false),M.path));
  for(let i=0;i<=10;i++){
    const p=curve.getPoint(i/10);
    pathGroup.add(ball(.015,M.path,p.x,p.y,p.z));
  }
}

// ── UI ──
const EX={
  body:new THREE.Vector3(0,-.05,0),
  roller:new THREE.Vector3(.16,.05,0),
  balls:new THREE.Vector3(-.05,.16,0),
  wheel_rl:new THREE.Vector3(0,0,.15),
  wheel_rr:new THREE.Vector3(0,0,-.15),
  caster:new THREE.Vector3(.12,.02,0),
  camera:new THREE.Vector3(.03,.18,0),
  tag:new THREE.Vector3(-.08,.20,0),
  battery:new THREE.Vector3(-.03,0,-.16),
};
let sel=null,ex=false,wf=false,pathOn=false;
meta.forEach(p=>{
  const b=document.createElement('button');b.className='pb';b.dataset.k=p.key;
  b.innerHTML='<span class="sw" style="background:'+p.color+'"></span><span>'+p.name+'</span><span class="dm">'+p.dims+'</span>';
  b.onclick=function(){focus(p.key)};
  G[p.group].appendChild(b);
});
function focus(key){
  sel=key;
  document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  Object.keys(parts).forEach(function(k){
    parts[k].traverse(function(c){
      if(c.isMesh&&c.material.emissive&&!c.material.equals(M.led)&&!c.material.equals(M.path)){
        c.material=c.material.clone();
        c.material.emissive.setHex(k===key?0x442200:0);
      }
    });
  });
  const g=parts[key];if(!g)return;
  const bb=new THREE.Box3().setFromObject(g);
  const ctr=bb.getCenter(new THREE.Vector3());
  const sz=bb.getSize(new THREE.Vector3()).length();
  const d=Math.max(.55,sz*2.2);
  cam.position.copy(ctr.clone().add(new THREE.Vector3(1,.75,.9).normalize().multiplyScalar(d)));
  ctrl.target.copy(ctr);ctrl.update();
}
document.getElementById('b-path').onclick=function(e){
  pathOn=!pathOn;e.target.classList.toggle('on',pathOn);pathGroup.visible=pathOn;
};
document.getElementById('b-ex').onclick=function(e){
  ex=!ex;e.target.classList.toggle('on',ex);
  Object.keys(parts).forEach(function(k){
    const g=parts[k];
    const b=g.userData.base,o=EX[k]||new THREE.Vector3();
    g.userData.tgt=ex?b.clone().add(o):b.clone();
  });
};
document.getElementById('b-wi').onclick=function(e){
  wf=!wf;e.target.classList.toggle('on',wf);
  Object.keys(M).forEach(function(k){M[k].wireframe=wf});
};
document.getElementById('b-gr').onclick=function(e){grid.visible=!grid.visible;e.target.classList.toggle('on',grid.visible)};
document.getElementById('b-ca').onclick=function(){
  sel=null;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('on'));
  Object.keys(parts).forEach(function(k){
    parts[k].traverse(function(c){
      if(c.isMesh&&c.material.emissive&&!c.material.equals(M.led)&&!c.material.equals(M.path))c.material.emissive.setHex(0);
    });
  });
  cam.position.copy(defPos);ctrl.target.set(0,.20,0);ctrl.update();
};
(function loop(){requestAnimationFrame(loop);
  Object.keys(parts).forEach(function(k){
    const g=parts[k];if(g.userData.tgt)g.position.lerp(g.userData.tgt,.09);
  });
  ctrl.update();R.render(scene,cam);
})();
addEventListener('resize',function(){
  cam.aspect=wrap.clientWidth/wrap.clientHeight;cam.updateProjectionMatrix();
  R.setSize(wrap.clientWidth,wrap.clientHeight);
});
// 侧前视，方便看滚轮左右轴
cam.position.set(1.45,.55,.95);ctrl.target.set(0,.18,0);ctrl.update();
setTimeout(function(){pathOn=true;pathGroup.visible=true;document.getElementById('b-path').classList.add('on')},150);
</script>
</body>
</html>
